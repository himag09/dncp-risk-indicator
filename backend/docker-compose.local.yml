services:
  db:
    image: postgres:15
    container_name: ocds_postgres_db
    environment:
      POSTGRES_USER: ocds_user
      POSTGRES_PASSWORD: ocds_password
      POSTGRES_DB: ocds_data
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocds_user -d ocds_data"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db

  worker:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db

volumes:
  pgdata: